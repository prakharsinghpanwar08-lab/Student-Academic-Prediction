version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: acad_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AcadSecret2026!}
      POSTGRES_DB: ${POSTGRES_DB:-academic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acad_admin} -d ${POSTGRES_DB:-academic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acad_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-acad_admin}:${POSTGRES_PASSWORD:-AcadSecret2026!}@db:5432/${POSTGRES_DB:-academic_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv

  # 3. React.js + Tailwind CSS Frontend Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acad_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
